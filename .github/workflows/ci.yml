name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

  build-e2e:
    name: Database, build, smoke e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3020
      # Test-mode placeholders so server code that validates env at build time can load.
      # The smoke suite never reaches Razorpay.
      RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      RAZORPAY_KEY_SECRET: ci-placeholder-secret
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Start Supabase
        # Studio, logs and the edge runtime are not needed by the app or the tests.
        run: supabase start -x studio,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Reset database (migrations + seed)
        run: supabase db reset

      - name: Database tests (pgTAP)
        run: |
          shopt -s globstar nullglob
          tests=(supabase/tests/**/*.sql)
          if (( ${#tests[@]} )); then supabase test db; else echo "No pgTAP tests yet"; fi

      - name: Export local Supabase env
        # `supabase status -o env` prints KEY="value"; $GITHUB_ENV needs KEY=value.
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            | grep -E '^[A-Z_]+=' \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'mdx-components.tsx', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e (mobile)
        run: npx playwright test --project=mobile-chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
